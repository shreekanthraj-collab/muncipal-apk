name: Flutter CI

on:
  push:
    branches:
      - fix/admin-app-analyzer-repair
  pull_request:
    branches:
      - feat/admin-5-page-wiring

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub
