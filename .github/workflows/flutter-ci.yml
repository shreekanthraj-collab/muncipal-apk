name: Flutter CI

on:
  push:
    branches:
      - fix/lora-low-voltage-bypass-status-ui
      - feat/municipal-server-valve-monitoring
  pull_request:
    branches:
      - fix/admin-app-analyzer-repair
      - feat/municipal-auth-session-claims

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub
